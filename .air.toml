root = "."
tmp_dir = "tmp"

[build]
cmd = "sh ./build.sh"
entrypoint = ["./tmp/site"]
args_bin = ["-serve"]
include_ext = ["*"]
exclude_dir = ["tmp", "dist", ".direnv", ".git"]
exclude_regex = ["_templ\\.go$"]
delay = 200
stop_on_error = true

[misc]
clean_on_exit = true

[proxy]
enabled = true
proxy_port = 8080
app_port = 8081
